name: Release

# Cut a release by pushing a version tag, e.g.:  git tag v0.2.1 && git push --tags
# This builds the wheel + sdist, runs the full test suite as a gate, publishes a
# GitHub Release with the artifacts attached, and publishes to PyPI via Trusted
# Publishing (OIDC -- no stored token). PyPI must have a trusted publisher set
# for this repo + workflow (owner Yash-Sukhdeve, repo facelock, workflow
# release.yml); the PyPI step runs after the Release step, so a publisher that is
# not yet configured fails only that step and never the GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the GitHub Release and upload assets
  id-token: write   # required for PyPI Trusted Publishing (OIDC); no stored token

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # System libs OpenCV + the Tk shield need so the (headless) test suite runs.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgl1 libglib2.0-0

      - name: Install build + test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e .
          python -m pip install pytest

      # Gate the release on a green suite: a failing step stops the job, so a
      # broken build is never published.
      - name: Run tests
        run: pytest -q

      - name: Build wheel + sdist
        run: python -m build

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish to PyPI only when a token is configured. Uses the official
      # publisher action; token via the `password` input.
      # Publish to PyPI via Trusted Publishing (OIDC) -- no stored token. The
      # OIDC credential is minted per-run from the id-token: write permission
      # above; PyPI matches it against the trusted publisher configured for this
      # repo + workflow. No `password:` input is used.
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
